<!DOCTYPE html>
<html lang="en" class="h-full bg-gray-100">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cases Table</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="p-4">
    <div class="overflow-auto border rounded shadow bg-white">
      <table class="min-w-full text-sm text-left">
        <thead class="bg-gray-100">
          <tr>
            <th class="p-2">ID</th>
            <th class="p-2">Date</th>
            <th class="p-2">Name</th>
            <th class="p-2">Mobile</th>
            <th class="p-2">Alt Mobile</th>
            <th class="p-2">Work</th>
            <th class="p-2">Frame Size</th>
            <th class="p-2">Frame Color</th>
            <th class="p-2">Required Details</th>
            <th class="p-2">Advance</th>
            <th class="p-2">Actual Price</th>
            <th class="p-2">Status</th>
            <th class="p-2">Actions</th>
          </tr>
        </thead>
        <tbody id="cases">
          <!-- Case rows will be dynamically inserted here -->
        </tbody>
      </table>
    </div>
  </body>
</html>
