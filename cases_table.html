<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Customer Cases</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white text-gray-800">
  <div class="p-4">
    <h2 class="text-xl font-bold mb-4">Customer Cases</h2>
    <div class="overflow-auto rounded border border-gray-300">
      <table class="min-w-full text-sm text-left">
        <thead class="bg-gray-100 font-medium border-b">
          <tr>
            <th class="px-3 py-2">ID</th>
            <th class="px-3 py-2">Date</th>
            <th class="px-3 py-2">Name</th>
            <th class="px-3 py-2">Mobile</th>
            <th class="px-3 py-2">Alt Mobile</th>
            <th class="px-3 py-2">Work</th>
            <th class="px-3 py-2">Frame Size</th>
            <th class="px-3 py-2">Frame Color</th>
            <th class="px-3 py-2">Required Details</th>
            <th class="px-3 py-2">Advance</th>
            <th class="px-3 py-2">Actual Price</th>
            <th class="px-3 py-2">Status</th>
            <th class="px-3 py-2">Actions</th>
          </tr>
        </thead>
        <tbody id="casesTable" class="divide-y divide-gray-200"></tbody>
      </table>
    </div>
  </div>

  <script>
    const baseUrl = "https://backend-7l9n.onrender.com";
    const token = localStorage.getItem("token");

    async function fetchCases() {
      try {
        const res = await fetch(`${baseUrl}/cases`, {
          headers: {
            Authorization: `Bearer ${token}`,
          },
        });
        const cases = await res.json();
        const table = document.getElementById("casesTable");
        table.innerHTML = "";

        cases.forEach((c) => {
          const row = document.createElement("tr");

          row.innerHTML = `
            <td class="px-3 py-2">${c.id}</td>
            <td class="px-3 py-2">${c.date}</td>
            <td class="px-3 py-2">${c.name}</td>
            <td class="px-3 py-2">${c.mobile}</td>
            <td class="px-3 py-2">${c.altMobile || ""}</td>
            <td class="px-3 py-2">${c.work || ""}</td>
            <td class="px-3 py-2">${c.frameSize || ""}</td>
            <td class="px-3 py-2">${c.frameColor || ""}</td>
            <td class="px-3 py-2">${c.requiredDetails || ""}</td>
            <td class="px-3 py-2">${c.advance || ""}</td>
            <td class="px-3 py-2">${c.actualPrice || ""}</td>
            <td class="px-3 py-2">${c.status || ""}</td>
            <td class="px-3 py-2 space-x-2">
              <button onclick='editCase(${JSON.stringify(c)})' class="bg-yellow-400 hover:bg-yellow-500 text-white px-2 py-1 rounded text-xs">Edit</button>
              <button onclick='deleteCase("${c.id}")' class="bg-red-500 hover:bg-red-600 text-white px-2 py-1 rounded text-xs">Delete</button>
            </td>
          `;
          table.appendChild(row);
        });
      } catch (err) {
        console.error("Fetch error:", err);
      }
    }

    function editCase(caseData) {
      const parent = window.parent;
      if (parent && typeof parent.fillEditForm === "function") {
        parent.fillEditForm(caseData);
      }
    }

    async function deleteCase(id) {
      if (!confirm("Are you sure you want to delete this case?")) return;

      try {
        const res = await fetch(`${baseUrl}/delete-case/${id}`, {
          method: "DELETE",
          headers: { Authorization: `Bearer ${token}` },
        });
        const data = await res.json();
        if (res.ok) {
          alert("Case deleted");
          fetchCases();
        } else {
          alert(data.error || "Delete failed");
        }
      } catch (err) {
        console.error("Delete error:", err);
      }
    }

    fetchCases();
  </script>
</body>
</html>
