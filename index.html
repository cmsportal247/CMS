<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Case Management</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <style>
    #loadingSpinner { display: none; }
    .hidden { display: none; }
  </style>
</head>
<body class="p-4">
  <!-- Toast -->
  <div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div class="toast" id="toast" role="alert">
      <div class="toast-body" id="toastMessage"></div>
    </div>
  </div>

  <!-- Loading Spinner -->
  <div id="loadingSpinner" class="text-center">
    <div class="spinner-border text-primary" role="status"></div>
  </div>

  <!-- Login Form -->
  <div id="loginSection">
    <h2>Login</h2>
    <form id="loginForm" class="mb-4">
      <div class="mb-3">
        <label for="username" class="form-label">Username</label>
        <input type="text" class="form-control" id="username" required />
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input type="password" class="form-control" id="password" required />
      </div>
      <button type="submit" class="btn btn-primary">Login</button>
    </form>
  </div>

  <!-- Case Management Section -->
  <div id="caseSection" class="hidden">
    <div class="d-flex justify-content-between mb-3">
      <h2>Case Management</h2>
      <button onclick="logout()" class="btn btn-danger">Logout</button>
    </div>

    <input type="text" id="searchInput" class="form-control mb-3" placeholder="Search cases..." />

    <form id="caseForm" class="row g-3 mb-4">
      <input type="hidden" id="caseId" />
      <div class="col-md-3"><input type="date" class="form-control" name="date" required /></div>
      <div class="col-md-3"><input type="text" class="form-control" name="name" placeholder="Name" required /></div>
      <div class="col-md-3"><input type="text" class="form-control" name="mobile" placeholder="Mobile" required /></div>
      <div class="col-md-3"><input type="text" class="form-control" name="altMobile" placeholder="Alt Mobile" /></div>
      <div class="col-md-3"><input type="text" class="form-control" name="work" placeholder="Work" /></div>
      <div class="col-md-3"><input type="text" class="form-control" name="frameSize" placeholder="Frame Size" /></div>
      <div class="col-md-3"><input type="text" class="form-control" name="frameColor" placeholder="Frame Color" /></div>
      <div class="col-md-3"><input type="text" class="form-control" name="requiredDetails" placeholder="Required Details" /></div>
      <div class="col-md-3"><input type="number" class="form-control" name="advance" placeholder="Advance" /></div>
      <div class="col-md-3"><input type="number" class="form-control" name="actualPrice" placeholder="Actual Price" /></div>
      <div class="col-md-3"><input type="text" class="form-control" name="status" placeholder="Status" /></div>
      <div class="col-md-3">
        <button type="submit" class="btn btn-success w-100">Save</button>
      </div>
    </form>

    <table class="table table-bordered">
      <thead>
        <tr>
          <th>#</th><th>Date</th><th>Name</th><th>Mobile</th><th>Alt</th><th>Work</th><th>Size</th><th>Color</th>
          <th>Details</th><th>Advance</th><th>Price</th><th>Status</th><th>Actions</th>
        </tr>
      </thead>
      <tbody id="caseTableBody"></tbody>
    </table>
    <ul class="pagination" id="pagination"></ul>
  </div>

  <script src="app.js"></script>
</body>
</html>
