<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Case Management</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <style>
    .tab-pane { display: none; }
    .tab-pane.active { display: block; }
    #loader { display: none; }
    .toast-container {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 1055;
    }
  </style>
</head>
<body>
  <div class="container mt-4">
    <!-- Login Section -->
    <div id="loginSection">
      <h3>Login</h3>
      <form id="loginForm">
        <input type="text" id="loginUsername" class="form-control mb-2" placeholder="Username" required />
        <input type="password" id="loginPassword" class="form-control mb-2" placeholder="Password" required />
        <button type="submit" class="btn btn-primary">Login</button>
      </form>
    </div>

    <!-- App Section -->
    <div id="appSection" style="display:none;">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Case Management</h2>
        <button id="logoutBtn" class="btn btn-danger">Logout</button>
      </div>

      <!-- Nav Tabs -->
      <ul class="nav nav-tabs mb-3">
        <li class="nav-item">
          <button class="nav-link active" data-tab="casesTab">Cases</button>
        </li>
        <li class="nav-item">
          <button class="nav-link" data-tab="reportsTab">Reports</button>
        </li>
        <li class="nav-item">
          <button class="nav-link" data-tab="settingsTab">Settings</button>
        </li>
      </ul>

      <!-- Cases Tab -->
      <div class="tab-pane active" id="casesTab">
        <div class="d-flex justify-content-between mb-2">
          <input type="text" id="searchInput" class="form-control me-2" placeholder="Search cases...">
          <button id="searchBtn" class="btn btn-primary me-2">Search</button>
          <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#caseModal">Add New Case</button>
        </div>

        <div id="loader" class="spinner-border text-primary mb-3" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>

        <table class="table table-bordered">
          <thead>
            <tr>
              <th>Date</th><th>Name</th><th>Mobile</th><th>Alt Mobile</th>
              <th>Work</th><th>Frame Size</th><th>Frame Color</th>
              <th>Required Details</th><th>Advance</th><th>Actual Price</th><th>Status</th><th>Actions</th>
            </tr>
          </thead>
          <tbody id="caseTableBody"></tbody>
        </table>
        <div id="pagination" class="mt-3"></div>
      </div>

      <!-- Reports Tab -->
      <div class="tab-pane" id="reportsTab">
        <h5>Export Cases by Date</h5>
        <div class="row g-2 mb-3">
          <div class="col-md-4">
            <input type="date" id="fromDate" class="form-control" placeholder="From Date" />
          </div>
          <div class="col-md-4">
            <input type="date" id="toDate" class="form-control" placeholder="To Date" />
          </div>
          <div class="col-md-4">
            <button id="exportBtn" class="btn btn-outline-primary w-100">Export CSV</button>
          </div>
        </div>
      </div>

      <!-- Settings Tab -->
      <div class="tab-pane" id="settingsTab">
        <h5>Change Password</h5>
        <form id="passwordForm" class="w-50">
          <input type="password" id="oldPassword" class="form-control mb-2" placeholder="Old Password" required />
          <input type="password" id="newPassword" class="form-control mb-2" placeholder="New Password" required />
          <button type="submit" class="btn btn-warning">Change Password</button>
        </form>
      </div>

      <!-- Modal for Add/Edit -->
      <div class="modal fade" id="caseModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
          <div class="modal-content">
            <form id="caseForm">
              <div class="modal-header">
                <h5 class="modal-title">Add / Edit Case</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
              </div>
              <div class="modal-body row g-3">
                <input type="hidden" id="id" />
                <div class="col-md-4">
                  <label>Date</label>
                  <input type="date" id="date" class="form-control" required />
                </div>
                <div class="col-md-4">
                  <label>Name</label>
                  <input type="text" id="name" class="form-control" required />
                </div>
                <div class="col-md-4">
                  <label>Mobile</label>
                  <input type="text" id="mobile" class="form-control" required />
                </div>
                <div class="col-md-4">
                  <label>Alt Mobile</label>
                  <input type="text" id="altMobile" class="form-control" />
                </div>
                <div class="col-md-4">
                  <label>Work</label>
                  <input type="text" id="work" class="form-control" />
                </div>
                <div class="col-md-4">
                  <label>Frame Size</label>
                  <input type="text" id="frameSize" class="form-control" />
                </div>
                <div class="col-md-4">
                  <label>Frame Color</label>
                  <input type="text" id="frameColor" class="form-control" />
                </div>
                <div class="col-md-4">
                  <label>Required Details</label>
                  <input type="text" id="requiredDetails" class="form-control" />
                </div>
                <div class="col-md-4">
                  <label>Advance</label>
                  <input type="text" id="advance" class="form-control" />
                </div>
                <div class="col-md-4">
                  <label>Actual Price</label>
                  <input type="text" id="actualPrice" class="form-control" />
                </div>
                <div class="col-md-4">
                  <label>Status</label>
                  <input type="text" id="status" class="form-control" />
                </div>
              </div>
              <div class="modal-footer">
                <button type="submit" class="btn btn-success">Save</button>
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
              </div>
            </form>
          </div>
        </div>
      </div>

      <!-- Toast -->
      <div class="toast-container" id="toastContainer"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
