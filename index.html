<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CS FrameNest - Case Management</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <style>
    body {
      background-color: #f8f9fa;
      font-family: 'Segoe UI', sans-serif;
    }
    .nav-tabs .nav-link.active {
      background-color: #0d6efd;
      color: #fff;
    }
    #loader {
      display: none;
    }
    .toast-container {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 1055;
    }
    .tab-section {
      display: none;
    }
    .tab-section.active {
      display: block;
    }
    table th, table td {
      vertical-align: middle !important;
    }
    .table-hover tbody tr:hover {
      background-color: #f1f1f1;
    }
  </style>
</head>
<body>
  <div class="container mt-5">
    <!-- Login Section -->
    <div id="loginSection">
      <h3 class="mb-3">Login to CS FrameNest</h3>
      <form id="loginForm" class="card p-4 shadow-sm bg-white">
        <input type="text" id="loginUsername" class="form-control mb-3" placeholder="Username" required />
        <input type="password" id="loginPassword" class="form-control mb-3" placeholder="Password" required />
        <button type="submit" class="btn btn-primary w-100">Login</button>
      </form>
    </div>

    <!-- App Section -->
    <div id="appSection" style="display: none;">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold">Case Management</h2>
        <button id="logoutBtn" class="btn btn-danger">Logout</button>
      </div>

      <!-- Nav Tabs -->
      <ul class="nav nav-tabs mb-4" id="mainTabs">
        <li class="nav-item">
          <button class="nav-link active" data-tab="casesTab">Cases</button>
        </li>
        <li class="nav-item">
          <button class="nav-link" data-tab="reportsTab">Reports</button>
        </li>
        <li class="nav-item">
          <button class="nav-link" data-tab="settingsTab">Settings</button>
        </li>
      </ul>

      <!-- CASES TAB -->
      <div id="casesTab" class="tab-section active">
        <div class="d-flex justify-content-between mb-3">
          <input type="text" id="searchInput" class="form-control me-2" placeholder="Search cases..."/>
          <button class="btn btn-success" id="addCaseBtn">Add New Case</button>
        </div>

        <div id="loader" class="spinner-border text-primary my-3" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>

        <div class="table-responsive">
          <table class="table table-bordered table-hover align-middle bg-white shadow-sm">
            <thead class="table-light">
              <tr>
                <th>Date</th>
                <th>Name</th>
                <th>Mobile</th>
                <th>Alt Mobile</th>
                <th>Work</th>
                <th>Frame Size</th>
                <th>Frame Color</th>
                <th>Required Details</th>
                <th>Advance</th>
                <th>Actual Price</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="caseTableBody"></tbody>
          </table>
        </div>
        <div id="pagination" class="mt-3"></div>
      </div>

      <!-- REPORTS TAB -->
      <div id="reportsTab" class="tab-section">
        <div class="card p-4 shadow-sm bg-white">
          <h5 class="mb-3">Export Cases to CSV</h5>
          <div class="row">
            <div class="col-md-5 mb-2">
              <label for="fromDate" class="form-label">From Date</label>
              <input type="date" id="fromDate" class="form-control" />
            </div>
            <div class="col-md-5 mb-2">
              <label for="toDate" class="form-label">To Date</label>
              <input type="date" id="toDate" class="form-control" />
            </div>
            <div class="col-md-2 d-flex align-items-end mb-2">
              <button id="exportBtn" class="btn btn-outline-primary w-100">Export CSV</button>
            </div>
          </div>
        </div>
      </div>

      <!-- SETTINGS TAB -->
      <div id="settingsTab" class="tab-section">
        <div class="card p-4 shadow-sm bg-white">
          <h5 class="mb-3">Change Password</h5>
          <form id="changePasswordForm">
            <input type="password" id="currentPassword" class="form-control mb-3" placeholder="Current Password" required />
            <input type="password" id="newPassword" class="form-control mb-3" placeholder="New Password" required />
            <button type="submit" class="btn btn-warning">Change Password</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- MODAL -->
  <div class="modal fade" id="caseModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="caseForm">
          <div class="modal-header">
            <h5 class="modal-title">Add / Edit Case</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="id" name="id" />
            <div class="row g-2">
              <div class="col-md-6">
                <label class="form-label">Date</label>
                <input type="date" id="date" name="date" class="form-control" required />
              </div>
              <div class="col-md-6">
                <label class="form-label">Name</label>
                <input type="text" id="name" name="name" class="form-control" required />
              </div>
              <div class="col-md-6">
                <label class="form-label">Mobile</label>
                <input type="text" id="mobile" name="mobile" class="form-control" required />
              </div>
              <div class="col-md-6">
                <label class="form-label">Alt Mobile</label>
                <input type="text" id="altMobile" name="altMobile" class="form-control" />
              </div>
              <div class="col-md-6">
                <label class="form-label">Work</label>
                <input type="text" id="work" name="work" class="form-control" />
              </div>
              <div class="col-md-6">
                <label class="form-label">Frame Size</label>
                <input type="text" id="frameSize" name="frameSize" class="form-control" />
              </div>
              <div class="col-md-6">
                <label class="form-label">Frame Color</label>
                <input type="text" id="frameColor" name="frameColor" class="form-control" />
              </div>
              <div class="col-md-6">
                <label class="form-label">Required Details</label>
                <input type="text" id="requiredDetails" name="requiredDetails" class="form-control" />
              </div>
              <div class="col-md-6">
                <label class="form-label">Advance</label>
                <input type="text" id="advance" name="advance" class="form-control" />
              </div>
              <div class="col-md-6">
                <label class="form-label">Actual Price</label>
                <input type="text" id="actualPrice" name="actualPrice" class="form-control" />
              </div>
              <div class="col-12">
                <label class="form-label">Status</label>
                <input type="text" id="status" name="status" class="form-control" />
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="submit" class="btn btn-primary">Save</button>
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Toasts -->
  <div class="toast-container" id="toastContainer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
