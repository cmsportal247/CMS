<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Case Management</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    #spinner { display: none; }
    #addCaseModal, #editCaseModal { display: none; }
  </style>
</head>
<body class="bg-light">

<div class="container my-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Case Management</h2>
    <button class="btn btn-danger" onclick="logout()">Logout</button>
  </div>

  <div class="mb-3">
    <input type="text" id="searchInput" class="form-control" placeholder="Search by name or mobile..." oninput="filterCases()" />
  </div>

  <div class="d-flex justify-content-between mb-3">
    <button class="btn btn-primary" onclick="showAddModal()">Add New Customer</button>
    <button class="btn btn-success" onclick="showReports()">Reports</button>
    <button class="btn btn-secondary" onclick="showSettings()">Settings</button>
  </div>

  <div id="spinner" class="text-center my-3">
    <div class="spinner-border"></div>
  </div>

  <div id="casesContainer"></div>
</div>

<!-- Add Case Modal -->
<div class="modal" tabindex="-1" id="addCaseModal">
  <div class="modal-dialog">
    <div class="modal-content">
      <form onsubmit="addCase(event)">
        <div class="modal-header">
          <h5 class="modal-title">Add New Case</h5>
          <button type="button" class="btn-close" onclick="hideAddModal()"></button>
        </div>
        <div class="modal-body">
          <!-- Fields same for add/edit -->
          <input class="form-control mb-2" name="date" placeholder="Date" required />
          <input class="form-control mb-2" name="name" placeholder="Name" required />
          <input class="form-control mb-2" name="mobile" placeholder="Mobile" required />
          <input class="form-control mb-2" name="altMobile" placeholder="Alt Mobile" />
          <input class="form-control mb-2" name="work" placeholder="Work" />
          <input class="form-control mb-2" name="frameSize" placeholder="Frame Size" />
          <input class="form-control mb-2" name="frameColor" placeholder="Frame Color" />
          <textarea class="form-control mb-2" name="requiredDetails" placeholder="Required Details"></textarea>
          <input class="form-control mb-2" name="advance" placeholder="Advance" />
          <input class="form-control mb-2" name="actualPrice" placeholder="Actual Price" />
          <select class="form-select mb-2" name="status">
            <option value="Pending">Pending</option>
            <option value="Delivered">Delivered</option>
          </select>
        </div>
        <div class="modal-footer">
          <button type="submit" class="btn btn-success">Save Case</button>
          <button type="button" class="btn btn-secondary" onclick="hideAddModal()">Cancel</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Reports Section -->
<div id="reportsSection" class="container d-none my-4">
  <h4>Export Reports</h4>
  <div class="row g-2">
    <div class="col"><input type="date" id="fromDate" class="form-control" /></div>
    <div class="col"><input type="date" id="toDate" class="form-control" /></div>
    <div class="col"><button class="btn btn-primary" onclick="exportExcel()">Download CSV</button></div>
  </div>
</div>

<!-- Settings Section -->
<div id="settingsSection" class="container d-none my-4">
  <h4>Change Password</h4>
  <input type="password" id="oldPassword" placeholder="Old Password" class="form-control mb-2" />
  <input type="password" id="newPassword" placeholder="New Password" class="form-control mb-2" />
  <button class="btn btn-warning" onclick="changePassword()">Change Password</button>
</div>

<script src="app.js"></script>
</body>
</html>
