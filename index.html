<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Case Management</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background-color: #f9f9f9;
      color: #333;
      margin: 0;
      padding: 0;
    }

    .container {
      margin-top: 30px;
    }

    .nav-tabs .nav-link {
      border-radius: 25px 25px 0 0;
      margin-right: 5px;
      padding: 12px 20px;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    .nav-tabs .nav-link:hover {
      background-color: #f0f0f0;
    }

    .nav-tabs .nav-link.active {
      background-color: #007bff;
      color: white;
    }

    .tab-content {
      border: 1px solid #ddd;
      border-radius: 0 0 10px 10px;
      padding: 20px;
      background-color: #fff;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    .modal-content {
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .table th, .table td {
      padding: 15px;
      text-align: center;
    }

    .btn-primary, .btn-danger, .btn-success {
      border-radius: 25px;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    .btn-primary:hover, .btn-danger:hover, .btn-success:hover {
      opacity: 0.9;
    }

    .form-control {
      border-radius: 10px;
      box-shadow: none;
    }

    .card {
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      border-radius: 10px;
    }

    .toast-container {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 1055;
    }

    .pagination {
      justify-content: center;
      margin-top: 20px;
    }

    .toast {
      background-color: #28a745;
      color: white;
    }

    .spinner-border {
      margin: auto;
      display: block;
    }

    .input-group .btn {
      border-radius: 10px;
    }

    .search-bar input {
      border-radius: 10px;
      padding: 10px;
    }

    .modal-header {
      background-color: #f8f9fa;
      border-bottom: 1px solid #ddd;
      border-radius: 10px 10px 0 0;
    }

    .modal-footer {
      border-top: 1px solid #ddd;
    }

    .toast-container .toast {
      animation: fadein 1s, fadeout 2s 3s;
    }

    @keyframes fadein {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes fadeout {
      from { opacity: 1; }
      to { opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="container mt-4">
    <!-- Login Section -->
    <div id="loginSection">
      <h3 class="text-center mb-4">Login</h3>
      <form id="loginForm" class="card p-4">
        <input type="text" id="loginUsername" class="form-control mb-3" placeholder="Username" required />
        <input type="password" id="loginPassword" class="form-control mb-3" placeholder="Password" required />
        <button type="submit" class="btn btn-primary w-100">Login</button>
      </form>
    </div>

    <!-- App Section -->
    <div id="appSection" style="display:none;">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Case Management</h2>
        <button id="logoutBtn" class="btn btn-danger">Logout</button>
      </div>

      <!-- Tabs Section -->
      <ul class="nav nav-tabs" id="tabs">
        <li class="nav-item">
          <a class="nav-link active" id="cases-tab" data-bs-toggle="tab" href="#cases">Cases</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" id="reports-tab" data-bs-toggle="tab" href="#reports">Reports</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" id="settings-tab" data-bs-toggle="tab" href="#settings">Settings</a>
        </li>
      </ul>

      <!-- Tab Content -->
      <div class="tab-content mt-3">
        <div class="tab-pane fade show active" id="cases">
          <div class="mb-3 d-flex justify-content-between align-items-center">
            <button id="addNewCaseBtn" class="btn btn-success">Add New Case</button>
            <div class="search-bar">
              <input type="text" id="searchInput" class="form-control w-25" placeholder="Search cases..." />
            </div>
          </div>

          <!-- Loader -->
          <div id="loader" class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
          </div>

          <!-- Cases Table -->
          <table class="table table-bordered">
            <thead>
              <tr>
                <th>Date</th>
                <th>Name</th>
                <th>Mobile</th>
                <th>Alt Mobile</th>
                <th>Work</th>
                <th>Frame Size</th>
                <th>Frame Color</th>
                <th>Required Details</th>
                <th>Advance</th>
                <th>Actual Price</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="caseTableBody"></tbody>
          </table>

          <!-- Pagination -->
          <div id="pagination" class="pagination justify-content-center mt-3"></div>
        </div>

        <div class="tab-pane fade" id="reports">
          <!-- Report Date Range Filter -->
          <div class="mb-3 d-flex">
            <input type="date" id="fromDate" class="form-control w-25 me-2" />
            <input type="date" id="toDate" class="form-control w-25 me-2" />
            <button class="btn btn-primary" id="filterReportBtn">Filter</button>
            <button class="btn btn-success" id="exportReportBtn">Export</button>
          </div>
        </div>

        <div class="tab-pane fade" id="settings">
          <p>Settings content will be here.</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal for adding/editing cases -->
  <div class="modal fade" id="caseModal" tabindex="-1" aria-labelledby="caseModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="caseModalLabel">Add/Edit Case</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="caseForm">
            <input type="text" class="form-control mb-2" placeholder="Name" required />
            <input type="text" class="form-control mb-2" placeholder="Mobile" required />
            <input type="text" class="form-control mb-2" placeholder="Alt Mobile" />
            <input type="text" class="form-control mb-2" placeholder="Work" />
            <input type="text" class="form-control mb-2" placeholder="Frame Size" />
            <input type="text" class="form-control mb-2" placeholder="Frame Color" />
            <textarea class="form-control mb-2" placeholder="Required Details"></textarea>
            <input type="number" class="form-control mb-2" placeholder="Advance" />
            <input type="number" class="form-control mb-2" placeholder="Actual Price" />
            <select class="form-control mb-2">
              <option value="pending">Pending</option>
              <option value="completed">Completed</option>
            </select>
            <button type="submit" class="btn btn-primary w-100">Save Case</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.4.8/dist/sweetalert2.all.min.js"></script>
  <script>
    // Handle your JavaScript logic here for the page
    // e.g., Login, Fetching Data, Adding Cases, etc.
  </script>
</body>
</html>
