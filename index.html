<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Case Management</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background-color: #f7f7f7;
      color: #333;
    }

    .container {
      margin-top: 30px;
    }

    .nav-tabs .nav-link {
      border-radius: 25px 25px 0 0;
      margin-right: 5px;
      padding: 12px 20px;
      font-weight: 600;
    }

    .nav-tabs .nav-link.active {
      background-color: #007bff;
      color: white;
    }

    .tab-content {
      border: 1px solid #ddd;
      border-radius: 0 0 10px 10px;
      padding: 20px;
      background-color: #fff;
    }

    .modal-content {
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .table {
      border-radius: 10px;
      overflow: hidden;
    }

    .table th, .table td {
      padding: 15px;
      text-align: center;
    }

    .btn-primary, .btn-danger, .btn-success {
      border-radius: 25px;
      font-weight: 600;
    }

    .form-control {
      border-radius: 10px;
    }

    .card {
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    .toast-container {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 1055;
    }

    .pagination {
      justify-content: center;
      margin-top: 20px;
    }

    .toast {
      background-color: #28a745;
      color: white;
    }

    .spinner-border {
      margin: auto;
      display: block;
    }

    .input-group .btn {
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <div class="container mt-4">
    <!-- Login Section -->
    <div id="loginSection">
      <h3 class="text-center mb-4">Login</h3>
      <form id="loginForm" class="card p-4">
        <input type="text" id="loginUsername" class="form-control mb-3" placeholder="Username" required />
        <input type="password" id="loginPassword" class="form-control mb-3" placeholder="Password" required />
        <button type="submit" class="btn btn-primary w-100">Login</button>
      </form>
    </div>

    <!-- App Section -->
    <div id="appSection" style="display:none;">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Case Management</h2>
        <button id="logoutBtn" class="btn btn-danger">Logout</button>
      </div>

      <!-- Tabs Section -->
      <ul class="nav nav-tabs" id="tabs">
        <li class="nav-item">
          <a class="nav-link active" id="cases-tab" data-bs-toggle="tab" href="#cases">Cases</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" id="reports-tab" data-bs-toggle="tab" href="#reports">Reports</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" id="settings-tab" data-bs-toggle="tab" href="#settings">Settings</a>
        </li>
      </ul>

      <!-- Tab Content -->
      <div class="tab-content mt-3">
        <div class="tab-pane fade show active" id="cases">
          <div class="mb-3 d-flex justify-content-between align-items-center">
            <button id="addNewCaseBtn" class="btn btn-success">Add New Case</button>
            <input type="text" id="searchInput" class="form-control w-25" placeholder="Search cases..." />
          </div>

          <!-- Loader -->
          <div id="loader" class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
          </div>

          <!-- Cases Table -->
          <table class="table table-bordered">
            <thead>
              <tr>
                <th>Date</th>
                <th>Name</th>
                <th>Mobile</th>
                <th>Alt Mobile</th>
                <th>Work</th>
                <th>Frame Size</th>
                <th>Frame Color</th>
                <th>Required Details</th>
                <th>Advance</th>
                <th>Actual Price</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="caseTableBody"></tbody>
          </table>

          <!-- Pagination -->
          <div id="pagination" class="pagination justify-content-center mt-3"></div>
        </div>

        <div class="tab-pane fade" id="reports">
          <!-- Report Date Range Filter -->
          <div class="mb-3 d-flex">
            <input type="date" id="fromDate" class="form-control w-25 me-2" />
            <input type="date" id="toDate" class="form-control w-25 me-2" />
            <button id="exportReportBtn" class="btn btn-primary">Export to CSV</button>
          </div>
        </div>

        <div class="tab-pane fade" id="settings">
          <div class="card p-4">
            <h5>Change Password</h5>
            <input type="password" id="newPassword" class="form-control mb-3" placeholder="New Password" />
            <button id="changePasswordBtn" class="btn btn-primary w-100">Change Password</button>
          </div>
        </div>
      </div>

      <!-- Modal for Add/Edit Case -->
      <div class="modal fade" id="caseModal" tabindex="-1">
        <div class="modal-dialog">
          <div class="modal-content">
            <form id="caseForm">
              <div class="modal-header">
                <h5 class="modal-title">Add / Edit Case</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
              </div>
              <div class="modal-body">
                <!-- Form fields for case details -->
                <input type="hidden" id="id" name="id" />
                <div class="mb-2">
                  <label for="date" class="form-label">Date</label>
                  <input type="date" class="form-control" id="date" name="date" required />
                </div>
                <!-- Other form fields go here... -->
              </div>
              <div class="modal-footer">
                <button type="submit" class="btn btn-success">Save</button>
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
              </div>
            </form>
          </div>
        </div>
      </div>

      <!-- Toast Container (optional) -->
      <div class="toast-container" id="toastContainer"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
