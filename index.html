<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Case Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.16/dist/tailwind.min.css" rel="stylesheet">
    <style>
        .animate-fadeIn {
            animation: fadeIn 1s ease-in-out;
        }
        @keyframes fadeIn {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="container mt-5 animate-fadeIn">
        <h1>Case Management</h1>

        <!-- Tab Navigation -->
        <ul class="nav nav-tabs" id="caseTabs" role="tablist">
            <li class="nav-item" role="presentation">
                <a class="nav-link active" id="cases-tab" data-bs-toggle="tab" href="#cases" role="tab" aria-controls="cases" aria-selected="true">Cases</a>
            </li>
            <li class="nav-item" role="presentation">
                <a class="nav-link" id="reports-tab" data-bs-toggle="tab" href="#reports" role="tab" aria-controls="reports" aria-selected="false">Reports</a>
            </li>
            <li class="nav-item" role="presentation">
                <a class="nav-link" id="settings-tab" data-bs-toggle="tab" href="#settings" role="tab" aria-controls="settings" aria-selected="false">Settings</a>
            </li>
        </ul>

        <div class="tab-content mt-3">
            <!-- Cases Tab -->
            <div class="tab-pane fade show active" id="cases" role="tabpanel" aria-labelledby="cases-tab">
                <button class="btn btn-success mb-3" onclick="addCase()">Add New Case</button>
                <table class="table table-bordered" id="caseTable">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Name</th>
                            <th>Mobile</th>
                            <th>Work</th>
                            <th>Frame Size</th>
                            <th>Frame Color</th>
                            <th>Required Details</th>
                            <th>Advance</th>
                            <th>Actual Price</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="caseList">
                        <!-- Cases will be dynamically inserted here -->
                    </tbody>
                </table>
                <nav>
                    <ul class="pagination" id="pagination"></ul>
                </nav>
            </div>

            <!-- Reports Tab -->
            <div class="tab-pane fade" id="reports" role="tabpanel" aria-labelledby="reports-tab">
                <button class="btn btn-primary" onclick="generateExcelReport()">Generate Excel Report</button>
            </div>

            <!-- Settings Tab -->
            <div class="tab-pane fade" id="settings" role="tabpanel" aria-labelledby="settings-tab">
                <p>Settings content will go here.</p>
            </div>
        </div>
    </div>

    <!-- Modal for Adding / Editing Case -->
    <div class="modal fade" id="caseModal" tabindex="-1" aria-labelledby="caseModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="caseModalLabel">Add/Edit Case</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="caseForm">
                        <input type="hidden" id="caseId" name="caseId">
                        <div class="mb-3">
                            <label for="name" class="form-label">Name</label>
                            <input type="text" class="form-control" id="name" name="name" required>
                        </div>
                        <div class="mb-3">
                            <label for="mobile" class="form-label">Mobile</label>
                            <input type="text" class="form-control" id="mobile" name="mobile" required>
                        </div>
                        <div class="mb-3">
                            <label for="work" class="form-label">Work</label>
                            <input type="text" class="form-control" id="work" name="work">
                        </div>
                        <div class="mb-3">
                            <label for="frameSize" class="form-label">Frame Size</label>
                            <input type="text" class="form-control" id="frameSize" name="frameSize">
                        </div>
                        <div class="mb-3">
                            <label for="frameColor" class="form-label">Frame Color</label>
                            <input type="text" class="form-control" id="frameColor" name="frameColor">
                        </div>
                        <div class="mb-3">
                            <label for="requiredDetails" class="form-label">Required Details</label>
                            <input type="text" class="form-control" id="requiredDetails" name="requiredDetails">
                        </div>
                        <div class="mb-3">
                            <label for="advance" class="form-label">Advance</label>
                            <input type="number" class="form-control" id="advance" name="advance">
                        </div>
                        <div class="mb-3">
                            <label for="actualPrice" class="form-label">Actual Price</label>
                            <input type="number" class="form-control" id="actualPrice" name="actualPrice">
                        </div>
                        <div class="mb-3">
                            <label for="status" class="form-label">Status</label>
                            <select class="form-control" id="status" name="status">
                                <option value="Pending">Pending</option>
                                <option value="Completed">Completed</option>
                                <option value="In Progress">In Progress</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-primary" id="submitButton">Save</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Loading Spinner -->
    <div id="loadingSpinner" class="text-center" style="display: none;">
        <div class="spinner-border" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.17.3/xlsx.full.min.js"></script>
    <script src="app.js"></script>

</body>
</html>
