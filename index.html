<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Case Management System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    #caseFormModal, #changePasswordModal {
      display: none;
    }
    .nav-tabs .nav-link.active {
      background-color: #0d6efd;
      color: #fff;
    }
    .tab-content {
      padding-top: 20px;
    }
  </style>
</head>
<body>
  <div class="container my-4" id="loginSection">
    <h2>Login</h2>
    <input type="text" class="form-control my-2" placeholder="Username" id="loginUsername" />
    <input type="password" class="form-control my-2" placeholder="Password" id="loginPassword" />
    <button class="btn btn-primary" onclick="login()">Login</button>
  </div>

  <div class="container my-4 d-none" id="mainApp">
    <ul class="nav nav-tabs" id="tabMenu">
      <li class="nav-item">
        <a class="nav-link active" data-bs-toggle="tab" href="#casesTab">Cases</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" data-bs-toggle="tab" href="#reportsTab">Reports</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" data-bs-toggle="tab" href="#settingsTab">Settings</a>
      </li>
      <li class="nav-item ms-auto">
        <button class="btn btn-danger btn-sm mt-1" onclick="logout()">Logout</button>
      </li>
    </ul>

    <div class="tab-content">
      <!-- Cases -->
      <div class="tab-pane container active" id="casesTab">
        <div class="d-flex justify-content-between align-items-center my-3">
          <h4>Customer Cases</h4>
          <button class="btn btn-success" onclick="openCaseForm()">Add New Customer</button>
        </div>
        <input type="text" class="form-control mb-2" placeholder="Search by name/mobile..." id="searchInput" onkeyup="filterCases()" />
        <div class="table-responsive">
          <table class="table table-bordered table-striped">
            <thead>
              <tr>
                <th>Date</th><th>Name</th><th>Mobile</th><th>Alt Mobile</th><th>Work</th><th>Frame Size</th>
                <th>Frame Color</th><th>Details</th><th>Advance</th><th>Price</th><th>Status</th><th>Actions</th>
              </tr>
            </thead>
            <tbody id="caseTableBody"></tbody>
          </table>
        </div>
      </div>

      <!-- Reports -->
      <div class="tab-pane container fade" id="reportsTab">
        <h4>Reports</h4>
        <div class="row g-2 mb-3">
          <div class="col-md-5">
            <input type="date" id="fromDate" class="form-control" />
          </div>
          <div class="col-md-5">
            <input type="date" id="toDate" class="form-control" />
          </div>
          <div class="col-md-2">
            <button class="btn btn-primary w-100" onclick="exportExcel()">Export</button>
          </div>
        </div>
      </div>

      <!-- Settings -->
      <div class="tab-pane container fade" id="settingsTab">
        <h4>Settings</h4>
        <button class="btn btn-warning" onclick="openPasswordModal()">Change Password</button>
      </div>
    </div>
  </div>

  <!-- Add/Edit Case Modal -->
  <div class="modal" id="caseFormModal">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <form id="caseForm">
          <div class="modal-header">
            <h5 class="modal-title">Case Form</h5>
            <button type="button" class="btn-close" onclick="closeCaseForm()"></button>
          </div>
          <div class="modal-body row g-2">
            <input type="hidden" id="caseId" />
            <div class="col-md-6"><input type="date" class="form-control" id="date" required /></div>
            <div class="col-md-6"><input type="text" class="form-control" placeholder="Name" id="name" required /></div>
            <div class="col-md-6"><input type="text" class="form-control" placeholder="Mobile" id="mobile" required /></div>
            <div class="col-md-6"><input type="text" class="form-control" placeholder="Alt Mobile" id="altMobile" /></div>
            <div class="col-md-6"><input type="text" class="form-control" placeholder="Work" id="work" /></div>
            <div class="col-md-6"><input type="text" class="form-control" placeholder="Frame Size" id="frameSize" /></div>
            <div class="col-md-6"><input type="text" class="form-control" placeholder="Frame Color" id="frameColor" /></div>
            <div class="col-md-6"><input type="text" class="form-control" placeholder="Required Details" id="requiredDetails" /></div>
            <div class="col-md-6"><input type="number" class="form-control" placeholder="Advance" id="advance" /></div>
            <div class="col-md-6"><input type="number" class="form-control" placeholder="Actual Price" id="actualPrice" /></div>
            <div class="col-md-6">
              <select class="form-select" id="status">
                <option value="Pending">Pending</option>
                <option value="Delivered">Delivered</option>
              </select>
            </div>
          </div>
          <div class="modal-footer">
            <button type="submit" class="btn btn-success">Save</button>
            <button type="button" class="btn btn-secondary" onclick="closeCaseForm()">Cancel</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Password Modal -->
  <div class="modal" id="changePasswordModal">
    <div class="modal-dialog">
      <div class="modal-content">
        <form onsubmit="changePassword(event)">
          <div class="modal-header">
            <h5>Change Password</h5>
            <button class="btn-close" onclick="closePasswordModal()"></button>
          </div>
          <div class="modal-body">
            <input type="password" class="form-control my-2" id="oldPassword" placeholder="Old Password" required />
            <input type="password" class="form-control my-2" id="newPassword" placeholder="New Password" required />
          </div>
          <div class="modal-footer">
            <button class="btn btn-warning">Update</button>
            <button type="button" class="btn btn-secondary" onclick="closePasswordModal()">Cancel</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
