<!DOCTYPE html>
<html lang="en" class="h-full bg-gray-100">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Case Management System</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="h-full">
  <!-- Main Container -->
  <div class="min-h-screen flex flex-col">
    
    <!-- Navbar -->
    <nav class="bg-blue-700 text-white shadow">
      <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
        <div class="text-xl font-bold">Case Management</div>
        <div class="space-x-6">
          <button id="btnChats" class="hover:text-gray-300">Chats</button>
          <button id="btnReports" class="hover:text-gray-300">Reports</button>
          <button id="btnSettings" class="hover:text-gray-300">Settings</button>
          <button id="btnLogout" class="hover:text-red-300">Logout</button>
        </div>
      </div>
    </nav>

    <!-- Login Section -->
    <section id="loginSection" class="flex-1 flex items-center justify-center">
      <div class="bg-white shadow-lg p-8 rounded w-full max-w-sm mt-20">
        <h2 class="text-2xl font-bold mb-4 text-center">Login</h2>
        <input id="mobile" type="text" placeholder="Mobile Number" class="w-full border px-4 py-2 rounded mb-4" />
        <input id="password" type="password" placeholder="Password" class="w-full border px-4 py-2 rounded mb-4" />
        <button id="loginBtn" class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700">Login</button>
        <p id="loginError" class="text-red-500 mt-3 text-sm hidden">Invalid credentials</p>
      </div>
    </section>

    <!-- Dashboard Section -->
    <section id="dashboardSection" class="hidden flex-1 p-6">
      <!-- Action Buttons -->
      <div class="flex justify-between mb-4">
        <h2 class="text-xl font-semibold">Customer Cases</h2>
        <button id="openModalBtn" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700">
          + Add New Case
        </button>
      </div>

      <!-- Iframe for Cases Table -->
      <iframe src="cases_table.html" class="w-full h-[600px] border rounded shadow bg-white" title="Cases Table"></iframe>
    </section>
  </div>

  <!-- Add/Edit Case Modal -->
  <div id="caseModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-50">
    <div class="bg-white p-6 rounded shadow w-full max-w-2xl relative overflow-y-auto max-h-screen">
      <h3 class="text-lg font-bold mb-4" id="modalTitle">Add New Case</h3>

      <form id="caseForm" class="grid grid-cols-2 gap-4">
        <input type="hidden" id="caseId" />
        <input type="date" id="date" placeholder="Date" class="border px-3 py-2 rounded" required />
        <input type="text" id="name" placeholder="Customer Name" class="border px-3 py-2 rounded" required />
        <input type="text" id="mobile" placeholder="Mobile" class="border px-3 py-2 rounded" required />
        <input type="text" id="altMobile" placeholder="Alternate Mobile" class="border px-3 py-2 rounded" />
        <input type="text" id="work" placeholder="Work" class="border px-3 py-2 rounded" />
        <input type="text" id="frameSize" placeholder="Frame Size" class="border px-3 py-2 rounded" />
        <input type="text" id="frameColor" placeholder="Frame Color" class="border px-3 py-2 rounded" />
        <input type="text" id="requiredDetails" placeholder="Required Details" class="border px-3 py-2 rounded" />
        <input type="number" id="advance" placeholder="Advance" class="border px-3 py-2 rounded" />
        <input type="number" id="actualPrice" placeholder="Actual Price" class="border px-3 py-2 rounded" />
        <select id="status" class="border px-3 py-2 rounded">
          <option value="Pending">Pending</option>
          <option value="Completed">Completed</option>
        </select>
      </form>

      <div class="flex justify-end space-x-4 mt-6">
        <button id="saveCaseBtn" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Save</button>
        <button id="closeModalBtn" class="bg-gray-400 text-white px-4 py-2 rounded hover:bg-gray-500">Cancel</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
