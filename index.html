<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Case Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<!-- Case Table (Embedded in HTML) -->
<div class="container mt-4">
    <h3>Customer Cases</h3>
    <table id="caseTable" class="table table-striped">
        <thead>
            <tr>
                <th>Name</th>
                <th>Mobile</th>
                <th>Work</th>
                <th>Frame Size</th>
                <th>Frame Color</th>
                <th>Required Details</th>
                <th>Advance</th>
                <th>Actual Price</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <!-- Data will be dynamically populated here -->
        </tbody>
    </table>
    <div id="pagination"></div>
    <div id="loadingSpinner" class="spinner-border text-primary" role="status" style="display:none;">
        <span class="visually-hidden">Loading...</span>
    </div>
</div>

<!-- Modal for Add/Edit Case (Hidden by default) -->
<div class="modal fade" id="caseModal" tabindex="-1" aria-labelledby="caseModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="caseModalLabel">Add/Edit Case</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <!-- Form for Add/Edit Case -->
                <form id="caseForm">
                    <div class="mb-3">
                        <label for="name" class="form-label">Name</label>
                        <input type="text" class="form-control" id="name" required>
                    </div>
                    <div class="mb-3">
                        <label for="mobile" class="form-label">Mobile</label>
                        <input type="text" class="form-control" id="mobile" required>
                    </div>
                    <div class="mb-3">
                        <label for="work" class="form-label">Work</label>
                        <input type="text" class="form-control" id="work" required>
                    </div>
                    <div class="mb-3">
                        <label for="frameSize" class="form-label">Frame Size</label>
                        <input type="text" class="form-control" id="frameSize" required>
                    </div>
                    <div class="mb-3">
                        <label for="frameColor" class="form-label">Frame Color</label>
                        <input type="text" class="form-control" id="frameColor" required>
                    </div>
                    <div class="mb-3">
                        <label for="requiredDetails" class="form-label">Required Details</label>
                        <input type="text" class="form-control" id="requiredDetails" required>
                    </div>
                    <div class="mb-3">
                        <label for="advance" class="form-label">Advance</label>
                        <input type="number" class="form-control" id="advance" required>
                    </div>
                    <div class="mb-3">
                        <label for="actualPrice" class="form-label">Actual Price</label>
                        <input type="number" class="form-control" id="actualPrice" required>
                    </div>
                    <div class="mb-3">
                        <label for="status" class="form-label">Status</label>
                        <select class="form-select" id="status" required>
                            <option value="Pending">Pending</option>
                            <option value="Completed">Completed</option>
                            <option value="In Progress">In Progress</option>
                        </select>
                    </div>
                    <input type="hidden" id="caseId">
                    <button type="submit" class="btn btn-primary" id="saveCaseBtn">Save Case</button>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- Search and Pagination -->
<div class="container mt-4">
    <input type="text" id="searchInput" class="form-control" placeholder="Search Cases" />
    <button id="searchButton" class="btn btn-primary mt-2">Search</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
<script src="app.js"></script>

</body>
</html>
